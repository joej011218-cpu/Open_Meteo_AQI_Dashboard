name: Hourly AQI Refresh

on:
  schedule:
    # Run at 5 minutes past every hour (UTC)
    - cron: "5 * * * *"

  # Also allows manual testing from GitHub
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Refresh Open-Meteo AQI forecast
        run: |
          curl --fail --show-error --silent \
            --request POST \
            "https://open-meteo-aqi-dashboard.onrender.com/api/refresh"
