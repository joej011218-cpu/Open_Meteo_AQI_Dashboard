name: Hourly AQI Refresh

on:
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Refresh Open-Meteo AQI forecast
        env:
          REFRESH_SECRET: ${{ secrets.REFRESH_SECRET }}
        run: |
          if [ -z "$REFRESH_SECRET" ]; then
            echo "ERROR: REFRESH_SECRET is not configured."
            exit 1
          fi

          curl --fail --show-error --silent \
            --retry 3 \
            --retry-delay 15 \
            --max-time 120 \
            --request POST \
            --header "X-Refresh-Secret: $REFRESH_SECRET" \
            "https://open-meteo-aqi-dashboard.onrender.com/api/refresh"

          echo "Refresh request accepted."
